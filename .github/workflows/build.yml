name: Construire Tounsi w Bark
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: build, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run build:www
        env: { GEMINI_KEY: "${{ secrets.GEMINI_KEY }}" }
      - name: Projet Android
        run: |
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' $M
          sed -i 's#</manifest>#    <queries>\n        <intent><action android:name="android.speech.RecognitionService" /></intent>\n        <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>\n    </queries>\n</manifest>#' $M
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"0.6.${{ github.run_number }}\"/" android/app/build.gradle
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r android-config/res/* android/app/src/main/res/
          npx cap sync android
          grep -E "versionCode|versionName" android/app/build.gradle
          grep -E "RECORD_AUDIO|TTS_SERVICE" $M
      - name: Clé de signature (toujours la même, pour pouvoir mettre à jour l'appli)
        run: mkdir -p ~/.android && cp android-config/debug.keystore ~/.android/debug.keystore
      - name: Construire l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk TounsiWBark.apk
      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tounsi w Bark (version ${{ github.run_number }})
          make_latest: true
          files: TounsiWBark.apk
