name: Voix IA (toutes les phrases d'une langue)
# Génère la voix de chaque phrase d'un pack qui n'en a pas encore, l'ajoute dans src/audio/<langue>-ia/ et relance l'APK.
# tn : SILMA TTS Derja (tunisien) ; dz : Habibi-TTS Specialized/ALG (darja algérienne, Apache 2.0 ; KasbahTTS avec MODELE=kasbah) ; ma : Habibi-TTS, modèle spécialisé MAR (darija marocaine, Apache 2.0). À relancer après un ajout de contenu :
# seules les nouvelles phrases sont générées. Coût : environ 1,5 à 2 minutes GitHub par phrase (tunisien : 830 min pour 476).
on:
  workflow_dispatch:
    inputs:
      langue:
        description: "Langue : tn (tunisien), dz (algérien) ou ma (marocain)"
        default: tn
      lots:
        description: Nombre de machines en parallèle
        default: '6'
permissions: { contents: write, actions: write }
concurrency: { group: "voix-toutes-${{ inputs.langue }}" }
jobs:
  liste:
    runs-on: ubuntu-latest
    outputs: { lots: "${{ steps.l.outputs.lots }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: l
        run: echo "lots=$(node tools/tts/collect.js lots ${{ inputs.lots }} ${{ inputs.langue }})" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: lots, path: lots/, if-no-files-found: ignore }
  voix:
    needs: liste
    if: needs.liste.outputs.lots != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: { lot: "${{ fromJSON(needs.liste.outputs.lots) }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: lots, path: lots }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Installer SILMA TTS (sans les outils d'arabe standard)
        if: inputs.langue == 'tn'
        run: |
          sudo apt-get install -y -q ffmpeg
          pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "numpy<=1.26.4" cached_path ema_pytorch hydra-core omegaconf librosa pydub safetensors soundfile tqdm transformers vocos "x_transformers>=1.31.14" torchdiffeq unidecode matplotlib huggingface_hub
          pip install -q --no-deps git+https://github.com/SILMA-AI/silma-tts.git
      - name: Installer Habibi-TTS (algérien, marocain) et la reconnaissance vocale
        if: inputs.langue == 'dz' || inputs.langue == 'ma'
        run: |
          sudo apt-get install -y -q ffmpeg
          pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q habibi-tts soundfile faster-whisper
      - name: Générer les voix
        env: { MAX_MINUTES: '300' }
        run: python tools/tts/${{ inputs.langue == 'dz' && 'generate-dz.py' || inputs.langue == 'ma' && 'generate-ma.py' || 'generate.py' }} lots/lot-${{ matrix.lot }}.json voix
      - name: Vérifier les durées (algérien, marocain)
        if: inputs.langue == 'dz' || inputs.langue == 'ma'
        run: python tools/tts/check-durations.py lots/lot-${{ matrix.lot }}.json voix || true
      - name: Vérifier qu'on entend de la parole (algérien, marocain) ; les fichiers inaudibles sont supprimés
        if: inputs.langue == 'dz' || inputs.langue == 'ma'
        run: python tools/tts/check-asr.py lots/lot-${{ matrix.lot }}.json voix rapport.md --supprimer || true
      - name: Convertir en mp3
        if: always()
        run: |
          mkdir -p mp3 && cd voix && for f in *.wav; do ffmpeg -loglevel error -y -i "$f" -ac 1 -b:a 48k "../mp3/${f%.wav}.mp3"; done; ls ../mp3 | wc -l
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "voix-${{ matrix.lot }}", path: mp3/*.mp3, if-no-files-found: ignore }
  ajouter:
    needs: voix
    if: always() && needs.voix.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "voix-*", path: "src/audio/${{ inputs.langue }}-ia", merge-multiple: true }
      - name: Enregistrer les voix dans le dépôt et reconstruire l'APK
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ls src/audio/${{ inputs.langue }}-ia | wc -l
          git config user.name "galllinho" && git config user.email "gallah8@gmail.com"
          git add src/audio/${{ inputs.langue }}-ia
          git diff --cached --quiet && { echo "Rien de nouveau"; exit 0; }
          git commit -q -m "Voix IA générées (${{ inputs.langue }}) : $(git diff --cached --name-only | wc -l) phrases"
          git pull -q --rebase && git push -q
          # Sur main : nouvelle version de l'APK. Sur une autre branche : les voix attendent la fusion, aucune publication.
          if [ "${{ github.ref_name }}" = "main" ]; then gh workflow run build.yml --ref main; else echo "Branche ${{ github.ref_name }} : pas de nouvelle version publiée"; fi
