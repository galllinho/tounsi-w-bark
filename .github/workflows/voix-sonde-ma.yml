name: Voix marocaine (sonde des modèles)
# Liste les modèles de voix marocains disponibles sur Hugging Face (fichiers, licences, fiches) : rien n'est publié.
on:
  push: { branches: [ameliorations], paths: ['.github/workflows/voix-sonde-ma.yml'] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q huggingface_hub
      - name: Dépôt GitHub de Habibi-TTS (extraits de référence par dialecte)
        run: |
          git clone -q --depth 1 https://github.com/SWivid/Habibi-TTS h && cd h && find . -path ./.git -prune -o -type f -print | head -200
          cat README.md | head -150
          grep -rn "MAR" --include=*.py --include=*.toml --include=*.json --include=*.txt --include=*.yaml . | head -60
      - name: Sonde
        shell: python
        run: |
          from huggingface_hub import HfApi, hf_hub_download
          api = HfApi()
          for repo in ['Jip7e/habibi-tts-doda-darija']:
              try:
                  info = api.model_info(repo, files_metadata=False)
                  print('==', repo, 'licence:', (info.card_data or {}).get('license') if info.card_data else None)
                  for s in info.siblings: print('   ', s.rfilename)
              except Exception as e: print('==', repo, 'ERREUR', e)
          for q in ['darija', 'moroccan', 'morocco', 'ary', 'maghrebi', 'habibi']:
              try:
                  ms = list(api.list_models(search=q, limit=60))
                  print('## recherche', q)
                  for m in ms:
                      if m.pipeline_tag in ('text-to-speech', 'text-to-audio') or 'tts' in m.id.lower(): print('   ', m.id, m.pipeline_tag, m.downloads)
              except Exception as e: print('## recherche', q, 'ERREUR', e)
          try:
              p = hf_hub_download('SWivid/Habibi-TTS', 'README.md'); print(open(p, encoding='utf-8').read())
          except Exception as e: print('README', e)
          try:
              p = hf_hub_download('facebook/mms-tts-ary', 'README.md'); print(open(p, encoding='utf-8').read()[:3000])
          except Exception as e: print('README mms', e)
