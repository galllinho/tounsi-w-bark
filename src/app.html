<style>
:root{
  --blue:#1d5aa6; --blue-d:#14427c; --blue-soft:#e3edf8;
  --sand:#fbf6ee; --card:#ffffff; --ink:#1f2430; --mute:#6b7280; --line:#e8e1d5;
  --terra:#c8553d; --terra-soft:#fbe7e1; --good:#2e7d4f; --good-soft:#e2f2e8;
  --gold:#e9b32a; --gold-soft:#fdf3d7;
  --r:18px; --shadow:0 2px 0 rgba(31,36,48,.06), 0 6px 18px rgba(31,36,48,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--sand);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.serif{font-family:Georgia,"Times New Roman",serif}
h1,h2,h3{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:-.01em}
.main{flex:1;padding:16px 16px 96px}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
.brand{font-family:Georgia,serif;font-weight:700;font-size:21px;color:var(--blue)}
.brand span{color:var(--terra)}
.chips{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:600;font-size:14px}
.chip svg{width:16px;height:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.bubble{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.say{display:flex;gap:12px;align-items:flex-start;margin:6px 0 18px}
.say .bubble{flex:1}
.say .bubble:before{content:"";position:absolute;left:-7px;top:18px;width:12px;height:12px;background:var(--card);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.av{flex:none;border-radius:50%;background:var(--blue-soft);overflow:hidden}
.sec{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:22px 4px 10px}
.level{padding:0;overflow:hidden}
.level-head{background:var(--blue);color:#fff;padding:16px 18px;position:relative;overflow:hidden}
.level-head h2{font-size:22px}
.level-head p{margin:2px 0 0;opacity:.85;font-size:14px}
.level-head .num{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.tiles{position:absolute;right:-10px;top:-10px;opacity:.18}
.path{padding:8px 10px 12px}
.step{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 8px;border-radius:14px}
.step:active{background:var(--sand)}
.step + .step{border-top:1px dashed var(--line)}
.dot{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;border:2px solid var(--line);background:var(--sand);color:var(--mute)}
.dot.open{background:var(--gold-soft);border-color:var(--gold);color:#8a6200}
.dot.done{background:var(--blue);border-color:var(--blue);color:#fff}
.dot.boss{border-radius:14px}
.step b{display:block;font-size:16px}
.step small{color:var(--mute);font-size:13px}
.stars{color:var(--gold);font-size:13px;letter-spacing:1px}
.locked{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-top:10px;color:var(--mute)}
.locked b{color:var(--ink);opacity:.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;min-height:52px}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-d)}
.btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blue-d)}
.btn-primary:disabled{background:#b8c3d3;box-shadow:none}
.btn-ghost{background:var(--card);border:1px solid var(--line)}
.btn-good{background:var(--good);color:#fff;box-shadow:0 3px 0 #1f5a38}
.btn-bad{background:var(--terra);color:#fff;box-shadow:0 3px 0 #94402e}
.btn-block{width:100%}
.field{width:100%;font:inherit;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.field:focus{outline:2px solid var(--blue);border-color:transparent}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 14px;margin:0 0 10px;font-weight:600;box-shadow:0 2px 0 var(--line)}
.opt small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ko{border-color:var(--terra);background:var(--terra-soft)}
.opt:disabled{opacity:1}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav-in{max-width:560px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--mute)}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--blue)}
.lesson{display:flex;flex-direction:column;min-height:100vh;padding-top:env(safe-area-inset-top)}
.lesson-top{display:flex;align-items:center;gap:12px;padding:12px 16px}
.x{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.x svg{width:22px;height:22px}
.bar{flex:1;height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
.lesson-body{flex:1;padding:8px 16px 16px}
.lesson-foot{padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:var(--sand)}
.q{font-size:14px;font-weight:700;color:var(--mute);margin:6px 0 10px}
.big{font-family:Georgia,serif;font-size:30px;font-weight:700;line-height:1.2;margin:4px 0 4px}
.ar{direction:rtl;font-size:20px;color:var(--mute);font-family:"Noto Naskh Arabic","Amiri",serif}
.fr{color:var(--mute);font-size:14px}
.note{font-size:13px;color:var(--terra);font-style:italic;margin-top:6px}
.listen{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-weight:700;font-size:14px;padding:6px 0}
.listen svg{width:20px;height:20px}
.feedback{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));z-index:20;animation:up .2s ease-out}
.feedback .in{max-width:560px;margin:0 auto}
.feedback.good{background:var(--good-soft);border-top:2px solid var(--good)}
.feedback.bad{background:var(--terra-soft);border-top:2px solid var(--terra)}
.feedback .head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.feedback h3{font-size:19px}
.feedback.good h3{color:var(--good)} .feedback.bad h3{color:var(--terra)}
.feedback p{margin:2px 0 0;font-size:14px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.tokens{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border-bottom:2px solid var(--line);margin-bottom:16px}
.tok{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:9px 13px;font-weight:700;box-shadow:0 2px 0 var(--line)}
.tok.used{visibility:hidden}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.mic{width:96px;height:96px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;margin:22px auto 8px;box-shadow:0 4px 0 var(--blue-d)}
.mic svg{width:40px;height:40px}
.mic.live{background:var(--terra);box-shadow:0 4px 0 #94402e;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.center{text-align:center}
.word{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--line)}
.word:last-child{border-bottom:0}
.word .w{flex:1}
.word b{font-size:17px}
.star{width:36px;height:36px;display:grid;place-items:center;color:#c9c2b4}
.star.on{color:var(--gold)}
.star svg,.icon-btn svg{width:22px;height:22px}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;color:var(--blue)}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.sw{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--blue)} .sw.on:after{left:23px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:24px;font-family:Georgia,serif}
.stat span{font-size:13px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90%}
.hero{text-align:center;padding:24px 8px 8px}
.hero h1{font-size:30px;color:var(--blue);margin-top:10px}
.hero h1 span{color:var(--terra)}
.muted{color:var(--mute)}
.tag{display:inline-block;font-size:12px;font-weight:700;background:var(--gold-soft);color:#8a6200;border-radius:99px;padding:3px 9px}
.search{margin-bottom:12px}
.filters{display:flex;gap:8px;margin-bottom:12px}
.filters button{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.result{text-align:center;padding-top:24px}
.result .bigstars{font-size:44px;color:var(--gold);letter-spacing:6px;margin:10px 0}
.result .bigstars .off{color:var(--line)}
.scene-me{display:flex;justify-content:flex-end;margin:6px 0 18px}
.scene-me .bubble{max-width:85%;background:var(--blue);color:#fff;border-color:var(--blue)}
.scene-me .bubble .fr{color:#d6e3f5}
.scene-me .bubble .ar{color:#d6e3f5}
.scene-me .bubble .listen{color:#fff}
.who{font-size:12px;font-weight:700;color:var(--mute);margin-bottom:2px}
.fadein{animation:fade .25s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.personas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.persona{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 12px;text-align:center}
.persona b{display:block;margin-top:8px}
.persona small{color:var(--mute);font-size:13px;line-height:1.3;display:block}
.chat{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top)}
.chat-top{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.chat-top .t{flex:1;line-height:1.2}
.chat-top .t small{color:var(--mute);font-size:12px}
.hf{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mute)}
.chat-body{flex:1;overflow-y:auto;padding:14px 12px 8px}
.chat-foot{border-top:1px solid var(--line);background:var(--card);padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
.me-msg{display:flex;justify-content:flex-end;margin:4px 0 14px}
.me-msg .bubble{background:var(--blue);color:#fff;border-color:var(--blue);max-width:80%}
.corr{font-size:13px;background:var(--terra-soft);color:#8a3322;border-radius:10px;padding:7px 10px;margin-top:8px}
.sugg{display:flex;align-items:center;gap:8px;background:var(--gold-soft);border-radius:12px;padding:8px 10px;margin-bottom:8px;font-size:14px}
.sugg button.use{flex:1;text-align:left}
.sugg small{color:#8a6200;display:block;font-size:12px}
.typing{display:inline-flex;gap:4px;padding:6px 2px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--mute);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.inrow{display:flex;gap:8px;align-items:center}
.inrow .field{padding:11px 12px}
.round{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff}
.round svg{width:22px;height:22px}
.round.live{background:var(--terra);animation:pulse 1s infinite}
.langs{display:flex;gap:6px;justify-content:center;margin-top:8px;font-size:12px}
.langs button{padding:4px 10px;border-radius:99px;border:1px solid var(--line);font-weight:700;color:var(--mute)}
.langs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.status{text-align:center;font-size:13px;color:var(--mute);min-height:18px;margin-top:6px}
</style>

<div id="root" class="app"></div>

<script src="content.js"></script>
<script src="content-kab.js"></script>
<script>
/* =========================================================
   Tounsi w Bark — v0.1
   Tunisien et kabyle, épisodes, révisions, discussion, Studio famille.
   Tout est stocké sur le téléphone (localStorage).
   ========================================================= */
'use strict';
const PACKS = window.TWB_CONTENT;
const CAST = window.TWB_CAST;
let PACK, KH, CHAT;
const LS = 'twb.state.v1';

// ---------- Fonctions natives (dans l'APK) ----------
const Native = (() => {
  const C = window.Capacitor;
  const isNative = !!(C && C.isNativePlatform && C.isNativePlatform());
  const plug = n => (isNative && C.registerPlugin && C.isPluginAvailable(n)) ? C.registerPlugin(n) : null;
  return { isNative, Speech: plug('SpeechRecognition'), TTS: plug('TextToSpeech'), App: plug('App'), LN: plug('LocalNotifications'), FS: plug('Filesystem'), Share: plug('Share'), Prefs: plug('Preferences') };
})();

// ---------- État ----------
const blank = () => ({ name: '', gender: 'm', lang: 'tn', xp: 0, done: {}, saved: [], weak: {}, review: '', streak: { last: '', count: 0 }, hontes: 0, opts: { fr: true, ar: false }, notif: { on: false, hour: 19 }, voiceName: '' });
let S = load();
function load(){ try { return Object.assign(blank(), JSON.parse(localStorage.getItem(LS) || '{}')); } catch(e){ return blank(); } }
function usePack(){
  PACK = PACKS[S.lang] || PACKS.tn; KH = PACK.lines;
  CHAT = Object.assign({}, window.TWB_CHAT, { rules: PACK.chat.rules, personas: PACK.chat.personas });
}
usePack();
// Sauvegarde : stockage natif d'Android (Preferences) qui survit à la fermeture de l'appli, + copie dans localStorage.
function save(){
  const v = JSON.stringify(S);
  try { localStorage.setItem(LS, v); } catch(e){}
  if (Native.Prefs) Native.Prefs.set({ key: LS, value: v }).catch(() => {});
}
async function restore(){
  if (!Native.Prefs) return;
  try {
    const { value } = await Native.Prefs.get({ key: LS });
    if (value) S = Object.assign(blank(), JSON.parse(value));
    else if (S.name) save();   // ancienne version : on recopie le profil dans le stockage natif
  } catch(e){}
}

// ---------- Outils ----------
const $ = s => document.querySelector(s);
const root = $('#root');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const yesterday = () => { const d = new Date(Date.now() - 864e5); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
function fill(s){
  const petit = S.gender === 'f' ? 'benti' : 'wlidi', petitAr = S.gender === 'f' ? 'بنتي' : 'وليدي';
  const f = S.gender === 'f';
  return String(s).replace(/\{petitAr\}/g, petitAr).replace(/\{petit\}/g, petit).replace(/\{prenom\}/g, S.name || 'Nour')
    .replace(/\{mmi\}/g, f ? 'a yelli' : 'a mmi').replace(/\{k\}/g, f ? 'm' : 'k').replace(/\{e\}/g, f ? 'e' : '')
    .replace(/\{jayAr\}/g, f ? 'جاية' : 'جاي').replace(/\{jay\}/g, f ? 'jaya' : 'jay')
    .replace(/\{petitFr\}/g, f ? 'ma petite' : 'mon petit')
    .replace(/\{mechiAr\}/g, f ? 'ماشية' : 'ماشي').replace(/\{mechi\}/g, f ? 'mechya' : 'mechi')
    .replace(/\{tounsiAr\}/g, f ? 'تونسية' : 'تونسي').replace(/\{tounsi\}/g, f ? 'tounsiya' : 'tounsi')
    .replace(/\{taalAr\}/g, f ? 'تعالي' : 'تعال').replace(/\{taal\}/g, f ? 'Taali' : 'Taal').replace(/\{ne\}/g, f ? 'ne' : '').replace(/\{cousinAr\}/g, f ? 'كوزينة' : 'كوزان').replace(/\{cousin\}/g, f ? 'cousine' : 'cousin').replace(/\{genre\}/g, f ? 'une fille' : 'un garçon');
}
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

const ICON = {
  flame: '<svg viewBox="0 0 24 24" fill="#e9852a"><path d="M12 2s5 4.5 5 10a5 5 0 0 1-10 0c0-2.2 1-3.8 2-5 .3 1.8 1.3 3 2.5 3.4C11 8 12 2 12 2z"/></svg>',
  jasmine: '<svg viewBox="0 0 24 24"><g fill="#fff" stroke="#e9b32a" stroke-width="1.2"><ellipse cx="12" cy="6.5" rx="3" ry="4.5"/><ellipse cx="12" cy="6.5" rx="3" ry="4.5" transform="rotate(72 12 12)"/><ellipse cx="12" cy="6.5" rx="3" ry="4.5" transform="rotate(144 12 12)"/><ellipse cx="12" cy="6.5" rx="3" ry="4.5" transform="rotate(216 12 12)"/><ellipse cx="12" cy="6.5" rx="3" ry="4.5" transform="rotate(288 12 12)"/></g><circle cx="12" cy="12" r="2" fill="#e9b32a"/></svg>',
  speaker: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21l1.4-7L2 9.3l7-.8z"/></svg>',
  learn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5V20H3z"/><path d="M9.5 20v-6h5v6"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v16H5.5A1.5 1.5 0 0 0 4 20.5z"/><path d="M4 20.5A1.5 1.5 0 0 0 5.5 22H20"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5 21 12 3 3.5l2.5 8.5zM5.5 12H13"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  lock: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'
};

// Portraits dessinés (personnages originaux)
function avatar(key, size){
  size = size || 48;
  const c = CAST[key] || {};
  if (key === 'me') {
    const hair = S.gender === 'f' ? '<path d="M26 58c-4-18 4-34 24-34s28 16 24 34c-4-10-10-16-24-16s-20 6-24 16z" fill="#2b1d16"/><path d="M26 56c-2 14 0 26 6 30M74 56c2 14 0 26-6 30" stroke="#2b1d16" stroke-width="8" fill="none" stroke-linecap="round"/>' : '<path d="M28 50c0-16 10-24 22-24s22 8 22 24c-6-8-14-10-22-10s-16 2-22 10z" fill="#2b1d16"/>';

function vnorm(t){ return String(t).toLowerCase().replace(/[\s.,!?;:…'’"«»()\-–—،؟]/g, ''); }
function vkey(text){ let h = 5381; const t = vnorm(text); for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) >>> 0; return S.lang + '_' + h.toString(36); }
const LOCAL = new Map(); let BUNDLE = {};
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('twb', 1); r.onupgradeneeded = () => r.result.createObjectStore('voices'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbPut(k, v){ try { const d = await idb(); await new Promise(r => { const t = d.transaction('voices', 'readwrite'); t.objectStore('voices').put(v, k); t.oncomplete = r; t.onerror = r; }); } catch(e){} }
async function loadVoices(){
  try { const d = await idb(); await new Promise(r => { const t = d.transaction('voices'); const st = t.objectStore('voices'); const c = st.openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { LOCAL.set(cur.key, cur.value); cur.continue(); } else r(); }; c.onerror = r; }); } catch(e){}
  try { const r = await fetch('audio/index.json'); if (r.ok) BUNDLE = await r.json(); } catch(e){}
}
let curAudio = null;
function playSrc(src){ return new Promise(res => { try { if (curAudio) curAudio.pause(); const a = new Audio(src); curAudio = a; a.onended = a.onerror = () => res(true); a.play().catch(() => res(false)); setTimeout(() => res(true), 15000); } catch(e){ res(false); } }); }
function playKey(k){ if (LOCAL.has(k)) return playSrc(URL.createObjectURL(LOCAL.get(k))); if (BUNDLE[k]) return playSrc('audio/' + BUNDLE[k]); return Promise.resolve(false); }
const ttsOK = () => PACK.voice === 'tts' && !!(Native.TTS || 'speechSynthesis' in window);
function hasVoice(raw){ if (!raw) return false; const k = vkey(fill(raw)); return LOCAL.has(k) || !!BUNDLE[k] || ttsOK(); }
async function speak(raw){
  if (!raw) return false;
  const text = fill(raw), k = vkey(text);
  if (LOCAL.has(k) || BUNDLE[k]) return playKey(k);
  if (PACK.voice !== 'tts') return false;
  if (Native.TTS) {
    for (const lang of PACK.ttsLangs) {
      try { await Native.TTS.speak({ text, lang, rate: 0.85, pitch: 1, volume: 1, category: 'playback' }); return true; } catch(e){}
    }
    toast('Installe une voix arabe dans les réglages Android (Synthèse vocale)');
    return false;
  }
  if ('speechSynthesis' in window) {
    const u = new SpeechSynthesisUtterance(text);
    const v = speechSynthesis.getVoices().find(v => /^ar/i.test(v.lang));
    if (v) u.voice = v; u.lang = v ? v.lang : 'ar-TN'; u.rate = 0.85;
    return new Promise(res => { u.onend = u.onerror = () => res(true); speechSynthesis.cancel(); speechSynthesis.speak(u); setTimeout(() => res(true), 12000); });
  }
  return false;
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const canListen = () => !!((Native.Speech || SR) && PACK.srLang);
async function listen(o){
  o = o || {};
  if (Native.Speech) {
    const R = Native.Speech;
    const { available } = await R.available();
    if (!available) throw new Error('indispo');
    const perm = await R.requestPermissions();
    if (perm.speechRecognition && perm.speechRecognition !== 'granted') throw new Error('refus');
    const r = await R.start({ language: o.lang || PACK.srLang || 'fr-FR', maxResults: 5, prompt: 'Ahki! (Parle !)', partialResults: false, popup: o.popup !== false });
    return (r && r.matches) || [];
  }
  return new Promise((res, rej) => {
    const rec = new SR(); rec.lang = o.lang || PACK.srLang || 'fr-FR'; rec.interimResults = false; rec.maxAlternatives = 5;
    rec.onresult = e => res(Array.from(e.results[0]).map(a => a.transcript));
    rec.onerror = e => rej(new Error(e.error === 'not-allowed' ? 'refus' : 'rien'));
    rec.onend = () => res([]);
    rec.start();
  });
}
function normAr(s){
  return String(s).replace(/[ً-ٰٟـ]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[ڨگ]/g, 'ق').replace(/[^ء-يa-z]/gi, '').toLowerCase();
}
function normLat(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z]/g, ''); }
function lev(a, b){
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let p = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++){ const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; }
  return p[n];
}
function sim(a, b){ if (!a || !b) return 0; return 1 - lev(a, b) / Math.max(a.length, b.length); }
function matchSpeech(heard, item){
  const tA = item.ar ? normAr(fill(item.ar)) : '', tL = normLat(fill(item.tn));
  return heard.some(h => Math.max(sim(normAr(h), tA), sim(normLat(h), tL)) >= 0.6);
}

// ---------- Rappel quotidien (notification locale, sans serveur) ----------
async function scheduleNotif(interactive){
  const LN = Native.LN;
  if (!LN) { if (interactive && S.notif.on) toast('Les rappels marchent seulement dans l’appli installée.'); return false; }
  try {
    await LN.cancel({ notifications: [{ id: 1 }] });
    if (!S.notif.on) return true;
    const p = await LN.requestPermissions();
    if (p.display !== 'granted') { toast('Notifications refusées : autorise-les dans les réglages Android.'); return false; }
    await LN.schedule({ notifications: [{ id: 1, title: MN(), body: fill(pick(PACK.notif)), schedule: { on: { hour: S.notif.hour, minute: 0 }, allowWhileIdle: false } }] });
    if (interactive) toast('C’est noté : ' + MN() + ' te relancera chaque jour à ' + S.notif.hour + ' h.');
    return true;
  } catch(e){ if (interactive) toast('Impossible de programmer le rappel.'); return false; }
}

let recorder = null, recChunks = [], recStream = null, recKey = null;
function studioItems(){
  const seen = new Set(), out = [];
  const add = it => {
    if (!it || !it.tn || /\{prenom\}/.test(it.tn)) return;
    const t = fill(V(it)); const k = vkey(t);
    if (seen.has(k)) return; seen.add(k);
    out.push({ key: k, text: t, tn: fill(it.tn), fr: fill(it.fr || '') });
  };
  PACK.levels.forEach(l => l.episodes.forEach(e => {
    e.scene.forEach(add); e.words.forEach(add);
    e.exercises.forEach(x => { if (x.type === 'speak') add(x); if (x.type === 'reply') add(x.line); });
  }));
  Object.values(PACK.chat.personas).forEach(p => add(p.hello));
  return out;
}
function stopRec(){ try { if (recorder && recorder.state !== 'inactive') recorder.stop(); } catch(e){} }
async function studio(){

async function toggleRec(key, btn){
  if (recorder && recorder.state === 'recording') { const same = recKey === key; stopRec(); if (same) return; }
  try {
    if (!recStream) recStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch(e){ toast('Micro refusé : autorise-le dans les réglages Android.'); return; }
  const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
  recChunks = []; recKey = key;
  recorder = new MediaRecorder(recStream, mime ? { mimeType: mime } : undefined);
  recorder.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
  recorder.onstop = async () => {
    btn.textContent = '●'; btn.style.color = 'var(--terra)';
    const blob = new Blob(recChunks, { type: recorder.mimeType || 'audio/webm' });
    if (blob.size < 1500) { toast('Trop court, réessaie.'); return; }
    await idbPut(key, blob); LOCAL.set(key, blob);
    const row = root.querySelector(`[data-k="${key}"]`); if (row) row.querySelector('[data-play]').hidden = false;
    const n = studioItems().filter(i => LOCAL.has(i.key)).length; const sc = $('#sc'); if (sc) sc.textContent = n + ' / ' + studioItems().length + ' phrases enregistrées';
    const ex = $('#exp'); if (ex) ex.disabled = false;
    playKey(key);
  };
  recorder.start();
  btn.textContent = '■'; btn.style.color = 'var(--ink)';
  setTimeout(() => { if (recorder && recorder.state === 'recording' && recKey === key) stopRec(); }, 12000);
}
const toB64 = blob => new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.readAsDataURL(blob); });
async function exportVoices(items){
  const rec = items.filter(i => LOCAL.has(i.key));
  const out = { format: 'twb-voices-1', lang: S.lang, voice: S.voiceName || '', date: new Date().toISOString(), items: [] };
  for (const i of rec) { const b = LOCAL.get(i.key); out.items.push({ key: i.key, text: i.text, tn: i.tn, fr: i.fr, mime: b.type, data: await toB64(b) }); }
  const name = `voix-${S.lang}-${(S.voiceName || 'famille').replace(/[^a-z0-9]+/gi, '-').toLowerCase()}-${today()}.json`;
  const json = JSON.stringify(out);
  if (Native.FS && Native.Share) {
    try {
      const w = await Native.FS.writeFile({ path: name, data: json, directory: 'CACHE', encoding: 'utf8' });
      await Native.Share.share({ title: 'Voix pour Tounsi w Bark', text: rec.length + ' phrases enregistrées', files: [w.uri], dialogTitle: 'Envoyer les voix' });
      return;
    } catch(e){ if (!/cancel/i.test(String(e && e.message))) toast('Partage impossible : ' + (e && e.message || 'erreur')); return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name; a.click();
}

// ---------- Exercices ----------
function others(word, field, pool, n){
  return shuffle(pool.filter(w => w.id !== word.id && w[field] !== word[field])).slice(0, n);
}
function buildQ(x, ctx){
  let pool = ctx.level ? allWords().filter(w => w.lvl === ctx.level.id) : learned();
  if (pool.length < 4) pool = allWords();
  if (x.type === 'meaning' || x.type === 'listen' || x.type === 'reverse') {
    const w = wordById(x.word);
    const field = x.type === 'reverse' ? 'tn' : 'fr';
    const opts = shuffle([w].concat(others(w, field, pool, 3))).map(o => ({ label: fill(o[field]), ok: o.id === w.id }));
    return { type: x.type, w, opts, answer: fill(w[field]) };
  }
  if (x.type === 'reply') return { type: 'reply', x, opts: shuffle(x.options), answer: fill(x.options.find(o => o.ok).tn) };
  if (x.type === 'order') {
    let t = shuffle(x.tokens); if (t.join(' ') === x.tokens.join(' ')) t = t.reverse();
    return { type: 'order', x, pool: t, answer: x.tokens.join(' ') };
  }
  if (x.type === 'speak') return { type: 'speak', x, answer: fill(x.tn) };
}

function runExercises(list, ctx){
  const queue = list.slice(), total = list.length;
  let doneCount = 0, firstTry = 0, hontes = 0;
  const retried = new Set();
  ctx.boss = !!ctx.boss;
  const next = () => {
    if (!queue.length) return finish();
    const x = queue.shift();
    show(x, buildQ(x, ctx));
  };
  const answered = (x, ok, info) => {
    if (x.word) { S.weak[x.word] = Math.max(0, (S.weak[x.word] || 0) + (ok ? -1 : 1)); }
    if (ok) { doneCount++; if (!retried.has(x)) firstTry++; }
    else { hontes++; if (!ctx.boss && !retried.has(x)) { retried.add(x); queue.push(x); } else doneCount++; }
    feedback(ok, info, next);
  };
  const progress = () => 0.4 + 0.6 * doneCount / total;
  const finish = () => ctx.boss ? bossResult(ctx.level, firstTry, total, hontes) : ctx.review ? reviewResult(firstTry, total, hontes) : epResult(ctx.ep, firstTry, total, hontes);

  function show(x, q){
    const check = `<button class="btn btn-primary btn-block" id="check" disabled>Vérifier</button>`;
    if (q.type === 'meaning' || q.type === 'reverse' || q.type === 'listen') {
      let prompt;
      if (q.type === 'meaning') prompt = `<div class="q">Ça veut dire quoi ?</div><div class="big">${esc(fill(q.w.tn))}</div>${arDiv(q.w)}${sayBtn(V(q.w))}`;
      if (q.type === 'reverse') prompt = `<div class="q">Comment on dit en tunisien ?</div><div class="big">${esc(fill(q.w.fr))}</div>`;
      const hv = hasVoice(V(q.w));
      if (q.type === 'listen') prompt = hv
        ? `<div class="q">Écoute et choisis la traduction</div><div class="center" style="margin:16px 0">${sayBtn(V(q.w), 'Réécouter')}</div><button class="btn btn-ghost" id="peek" style="min-height:0;padding:8px 12px;font-size:14px">Je n’ai pas de son : afficher le mot</button><div class="big" id="peekw" hidden>${esc(fill(q.w.tn))}</div>`
        : `<div class="q">Choisis la traduction</div><div class="big">${esc(fill(q.w.tn))}</div>`;
      lessonFrame(progress(), prompt + `<div style="margin-top:18px">${q.opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o.label)}</button>`).join('')}</div>`, check);
      if (q.type === 'listen' && hv) { speak(V(q.w)); const p = $('#peek'); if (p) p.onclick = () => { $('#peekw').hidden = false; p.remove(); }; }
      choose(q.opts, i => {
        const ok = q.opts[i].ok;
        markOpts(q.opts);
        answered(x, ok, { answer: q.answer, sub: fill(q.w.tn) + ' = ' + fill(q.w.fr), ar: V(q.w) });
      });
    }
    if (q.type === 'reply') {
      const l = q.x.line;
      lessonFrame(progress(), `<div class="q">Réponds à ${esc(CAST[q.x.who].name)}</div>
        <div class="say">${avatar(q.x.who, 48)}<div class="bubble"><div>${esc(fill(l.tn))}</div>${arDiv(l)}<div class="fr" ${S.opts.fr ? '' : 'hidden'}>${esc(fill(l.fr))}</div>${sayBtn(V(l))}</div></div>
        ${q.opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(fill(o.tn))}<small hidden>${esc(fill(o.fr))}</small></button>`).join('')}`, check);
      choose(q.opts, i => {
        const o = q.opts[i];
        markOpts(q.opts); root.querySelectorAll('.opt small').forEach(s => s.hidden = false);
        answered(x, !!o.ok, { answer: q.answer, sub: o.ok ? fill(o.fr) : fill(o.why || ''), ar: null });
      });
    }
    if (q.type === 'order') {
      let built = [];
      const draw = () => {
        $('#built').innerHTML = built.map((ti, k) => `<button class="tok" data-k="${k}">${esc(q.pool[ti])}</button>`).join('');
        root.querySelectorAll('.pool .tok').forEach(b => b.classList.toggle('used', built.includes(+b.dataset.t)));
        root.querySelectorAll('#built .tok').forEach(b => b.onclick = () => { built.splice(+b.dataset.k, 1); draw(); });
        $('#check').disabled = built.length !== q.pool.length;
      };
      lessonFrame(progress(), `<div class="q">Remets la phrase dans l’ordre</div><div class="big" style="font-size:22px">${esc(fill(q.x.fr))}</div>
        <div class="tokens" id="built"></div><div class="pool">${q.pool.map((t, i) => `<button class="tok" data-t="${i}">${esc(t)}</button>`).join('')}</div>`, check);
      root.querySelectorAll('.pool .tok').forEach(b => b.onclick = () => { const t = +b.dataset.t; if (!built.includes(t)) { built.push(t); draw(); } });
      draw();
      $('#check').onclick = () => {
        const said = built.map(i => q.pool[i]).join(' ');
        answered(x, normLat(said) === normLat(q.answer), { answer: q.answer, sub: fill(q.x.fr), ar: null });
      };
    }
    if (q.type === 'speak') {
      const can = canListen();
      lessonFrame(progress(), `<div class="q">Dis-le à voix haute</div><div class="big">${esc(fill(q.x.tn))}</div>${arDiv(q.x)}<div class="fr">${esc(fill(q.x.fr))}</div>${sayBtn(V(q.x))}
        ${can ? `<button class="mic" id="mic" aria-label="Parler">${ICON.mic}</button><p class="center muted" id="heard" style="font-size:14px">Touche le micro et parle</p>` : `<p class="muted" style="margin-top:20px">Le micro n’est pas disponible ici. Dis la phrase à voix haute quand même, ${esc(MN())} t’écoute.</p>`}`,
        `<div class="seg"><button class="btn btn-ghost" id="skip">Pas maintenant</button><button class="btn btn-ghost" id="self">${can ? 'Je l’ai bien dit' : 'C’est fait'}</button></div>`);
      $('#skip').onclick = () => { doneCount++; next(); };
      $('#self').onclick = () => answered(x, true, { answer: q.answer, sub: MN() + ' te fait confiance. Pour cette fois.', ar: null });
      const m = $('#mic');
      if (m) m.onclick = async () => {
        m.classList.add('live'); $('#heard').textContent = 'Je t’écoute…';
        try {
          const heard = await listen();
          m.classList.remove('live');
          if (!heard.length) { $('#heard').textContent = 'Je n’ai rien entendu. Réessaie, plus fort, comme au souk.'; return; }
          if (matchSpeech(heard, q.x)) return answered(x, true, { answer: q.answer, sub: 'J’ai entendu : « ' + heard[0] + ' »', ar: null });
          $('#heard').innerHTML = `J’ai entendu : « ${esc(heard[0])} »<br>Pas tout à fait. Réessaie, ou touche « Je l’ai bien dit ».`;
        } catch(e){
          m.classList.remove('live');
          $('#heard').textContent = e.message === 'refus' ? 'Micro refusé : autorise-le dans les réglages Android.' : e.message === 'indispo' ? 'Reconnaissance vocale indisponible sur ce téléphone.' : 'Je n’ai pas compris. Réessaie.';
        }
      };
    }
  }
  function choose(opts, onCheck){
    let sel = -1;
    root.querySelectorAll('.opt[data-i]').forEach(b => b.onclick = () => {
      sel = +b.dataset.i;
      root.querySelectorAll('.opt[data-i]').forEach(o => o.classList.toggle('sel', o === b));
      $('#check').disabled = false;
    });
    $('#check').onclick = () => { if (sel >= 0) { root.querySelectorAll('.opt[data-i]').forEach(o => o.disabled = true); onCheck(sel); markSel(sel); } };
  }
  function markOpts(opts){ root.querySelectorAll('.opt[data-i]').forEach(b => { if (opts[+b.dataset.i].ok) b.classList.add('ok'); }); }
  function markSel(i){ const b = root.querySelector(`.opt[data-i="${i}"]`); if (b && !b.classList.contains('ok')) { b.classList.remove('sel'); b.classList.add('ko'); } }
  next();
}

function feedback(ok, info, onNext){
  const f = document.createElement('div');
  f.className = 'feedback ' + (ok ? 'good' : 'bad');
  const msg = fill(pick(ok ? KH.right : KH.wrong));
  f.innerHTML = `<div class="in"><div class="head">${avatar(PACK.mascot, 44)}<div><h3>${ok ? (S.lang === 'kab' ? 'Ayuz !' : 'Mrigel !') : (S.lang === 'kab' ? 'A yemma…' : 'Ya hasra…')}</h3><p>${esc(msg)}</p></div></div>
    ${!ok ? `<p style="margin:0 0 4px"><b>Bonne réponse :</b> ${esc(info.answer)}</p>` : ''}${info.sub ? `<p class="muted" style="margin:0 0 10px;font-size:14px">${esc(info.sub)}</p>` : '<div style="height:6px"></div>'}
    <button class="btn ${ok ? 'btn-good' : 'btn-bad'} btn-block" id="cont">Continuer</button></div>`;
  document.body.appendChild(f);
  const foot = root.querySelector('.lesson-foot'); if (foot) foot.style.visibility = 'hidden';
  if (info.ar && !ok && hasVoice(info.ar)) speak(info.ar);
  if (navigator.vibrate && !ok) navigator.vibrate(60);
  f.querySelector('#cont').onclick = () => { f.remove(); onNext(); };
}

// ---------- Résultats ----------
function epResult(ep, firstTry, total, hontes){
  const stars = hontes === 0 ? 3 : hontes <= 2 ? 2 : 1;
  const gain = firstTry * 10 + 20;
  const prev = S.done[ep.id];
  S.done[ep.id] = { stars: Math.max(stars, prev ? prev.stars : 0), at: today() };
  S.xp += gain; S.hontes += hontes; bumpStreak(); save();
  const msg = stars === 3 ? 'Zéro faute ! Je vais le raconter à toute la famille, même à ceux qui ne t’ont rien demandé.' : stars === 2 ? 'Pas mal du tout. Quelques petites hontes, mais on n’en parlera pas au mariage.' : 'On a souffert ensemble. Mais tu es allé' + fill('{e}') + ' jusqu’au bout, et ça, c’est la famille.';
  const lvl = levelOf(ep.id);
  const nextEp = lvl.episodes[epIndex(ep.id) + 1];
  lessonFrame(1, `<div class="result">${avatar(PACK.mascot, 110)}
      <div class="bigstars">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3 - stars)}</span></div>
      <h1 style="font-size:28px">Épisode terminé !</h1>
      <div class="say" style="margin-top:16px;text-align:left">${avatar(PACK.mascot, 40)}<div class="bubble">${esc(msg)}</div></div>
      <div class="stats" style="margin-top:8px"><div class="stat"><b>+${gain}</b><span>jasmins</span></div><div class="stat"><b>${hontes}</b><span>moment${hontes > 1 ? 's' : ''} de honte</span></div></div></div>`,
    `<button class="btn btn-primary btn-block" id="next">${nextEp ? 'Épisode suivant' : 'Retour au parcours'}</button>`);
  $('#quit').onclick = () => { stack = []; home(); };
  screen = 'result';
  $('#next').onclick = () => { stack = []; if (nextEp) go(() => intro(nextEp)); else home(); };
}

function startBoss(level){
  const pool = shuffle(allWords().filter(w => w.lvl === level.id));
  const types = ['meaning', 'reverse', 'listen'];
  const list = pool.slice(0, level.boss.count).map((w, i) => ({ type: types[i % 3], word: w.id }));
  stack = [];
  const pet = S.lang === 'kab' ? fill('{mmi}') : 'ya ' + fill('{petit}');
  lessonFrame(0, `<div class="center" style="padding-top:12px">${avatar(PACK.mascot, 110)}<h1 style="font-size:28px;margin:14px 0 8px">${esc(level.boss.title)}</h1>
      <p class="muted">${esc(level.boss.pitch)}</p>
      <div class="say" style="text-align:left;margin-top:18px">${avatar(PACK.mascot, 40)}<div class="bubble">Pas de deuxième chance ici, ${esc(pet)}. Concentre-toi.</div></div></div>`,
    `<button class="btn btn-primary btn-block" id="next">Je suis prêt${fill('{e}')}</button>`);
  $('#next').onclick = () => runExercises(list, { boss: true, level });
}
function bossResult(level, score, total, hontes){
  const pass = score >= level.boss.pass;
  if (pass) { S.done[level.boss.id] = { stars: 3, at: today() }; S.xp += 50; }
  S.hontes += hontes; bumpStreak(); save();
  const nxt = PACK.levels[PACK.levels.indexOf(level) + 1];
  const ok = (S.lang === 'kab' ? 'Ayuz ! ' : 'Mrigel ! ') + 'Tu as réussi mon épreuve. ' + (nxt && nxt.episodes.length ? 'Le niveau ' + nxt.num + ' « ' + nxt.name + ' » est ouvert !' : 'La suite arrive bientôt.');
  lessonFrame(1, `<div class="result">${avatar(PACK.mascot, 110)}
      <h1 style="font-size:30px;margin-top:14px">${score} / ${total}</h1>
      <div class="say" style="margin-top:16px;text-align:left">${avatar(PACK.mascot, 40)}<div class="bubble">${esc(pass ? ok : 'Pas encore… Révise ton carnet, bois un thé, et reviens me voir. Il en faut ' + level.boss.pass + '.')}</div></div>
      ${pass ? `<div class="stats" style="margin-top:8px"><div class="stat"><b>+50</b><span>jasmins</span></div><div class="stat"><b>Niveau ${level.num}</b><span>terminé</span></div></div>` : ''}</div>`,
    `<button class="btn btn-primary btn-block" id="next">${pass ? 'Retour au parcours' : 'Réessayer plus tard'}</button>`);
  screen = 'result';
  $('#quit').onclick = $('#next').onclick = () => { stack = []; home(); };
}

// ---------- Discussion libre (Gemini, offre gratuite) ----------
const GEMINI_KEY = window.TWB_GEMINI_KEY || '';
let chatRun = 0, chatState = null;
function chatLeft(){
  if (!S.chat || S.chat.day !== today()) S.chat = { day: today(), count: 0 };
  return Math.max(0, CHAT.dailyLimit - S.chat.count);
}
function chatHome(){
  const ok = !!GEMINI_KEY;
  const cards = Object.keys(CHAT.personas).map(k => `<button class="persona" data-p="${k}">${avatar(k, 64)}<b>${esc(CAST[k].name)}</b><small>${esc(CAST[k].role)}</small></button>`).join('');
  shell(`<h2 style="font-size:26px;margin:4px 0 4px">Discuter</h2>
    <p class="muted" style="margin:0 0 14px">${PACK.srLang ? 'Parle tunisien à voix haute, ils te répondent. Active « mains libres » pour enchaîner sans toucher l’écran.' : 'Écris en kabyle (ou parle en français au micro), ils te répondent en kabyle.'}</p>
    ${PACK.draft ? '<div class="card" style="margin-bottom:14px;background:var(--gold-soft);border-color:var(--gold);font-size:14px"><b>Bêta.</b> L’IA connaît moins bien le kabyle que le tunisien : elle peut faire des fautes. Le téléphone ne comprend pas le kabyle à l’oral, et les réponses ne sont pas lues à voix haute.</div>' : ''}
    ${ok ? '' : '<div class="card" style="margin-bottom:14px;background:var(--gold-soft);border-color:var(--gold)"><b>Pas encore activé</b><p class="muted" style="margin:4px 0 0;font-size:14px">La clé Gemini n’est pas encore installée dans cette version de l’appli.</p></div>'}
    <div class="personas">${cards}</div>
    <p class="muted center" style="font-size:13px;margin-top:16px">${chatLeft()} répliques restantes aujourd’hui · ne raconte rien de personnel : en version gratuite, Google peut lire les échanges.</p>`);
  root.querySelectorAll('[data-p]').forEach(b => b.onclick = () => ok ? openChat(b.dataset.p) : toast('La discussion arrive dans la prochaine version.'));
}

function openChat(key){
  const run = ++chatRun;
  const p = CHAT.personas[key];
  chatState = { key, run, msgs: [Object.assign({ role: 'ai' }, p.hello, { correction: '', sugg: null })], hands: false, lang: PACK.srLang || 'fr-FR', busy: false, listening: false, status: '' };
  screen = 'chat';
  root.innerHTML = `<div class="chat">
    <div class="chat-top"><button class="x" id="cx" aria-label="Fermer">${ICON.close}</button>${avatar(key, 40)}
      <div class="t"><b>${esc(CAST[key].name)}</b><br><small>${esc(CAST[key].role)}</small></div>
      <span class="hf">Mains libres<button class="sw" id="hf" aria-label="Mains libres"></button></span></div>
    <div class="chat-body" id="cb"></div>
    <div class="chat-foot"><div id="sg"></div>
      <div class="inrow"><input class="field" id="ti" placeholder="Écris en ${esc(PACK.name.toLowerCase())}…" autocomplete="off" enterkeyhint="send">
        <button class="round" id="send" aria-label="Envoyer">${ICON.send}</button>
        <button class="round" id="mc" aria-label="Parler">${ICON.mic}</button></div>
      <div class="langs"><span class="muted" style="align-self:center">Je parle :</span>${PACK.srLang ? `<button data-l="${PACK.srLang}" class="on">${esc(PACK.short)}</button><button data-l="fr-FR">Français</button>` : '<button data-l="fr-FR" class="on">Français</button>'}</div>
      <div class="status" id="st"></div></div></div>`;
  $('#cx').onclick = () => { chatRun++; stack = []; tab = 'chat'; home(); };
  $('#hf').onclick = () => { chatState.hands = !chatState.hands; $('#hf').classList.toggle('on', chatState.hands); if (chatState.hands && !chatState.busy && !chatState.listening) hear(run); };
  $('#send').onclick = () => { const v = $('#ti').value.trim(); if (v) { $('#ti').value = ''; turn(v, run); } };
  $('#ti').onkeydown = e => { if (e.key === 'Enter') $('#send').click(); };
  $('#mc').onclick = () => { if (!chatState.busy && !chatState.listening) hear(run); };
  root.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { chatState.lang = b.dataset.l; root.querySelectorAll('[data-l]').forEach(x => x.classList.toggle('on', x === b)); });
  drawChat();
  speak(V(p.hello));
}
function setStatus(t){ chatState.status = t; const e = $('#st'); if (e) e.textContent = t; }
function drawChat(){
  const st = chatState, k = st.key;
  const html = st.msgs.map((m, i) => m.role === 'me'
    ? `<div class="me-msg"><div class="bubble">${esc(m.text)}</div></div>`
    : m.err ? `<div class="say">${avatar(k, 36)}<div class="bubble" style="background:var(--gold-soft)">${esc(m.err)}</div></div>`
    : `<div class="say">${avatar(k, 36)}<div class="bubble" data-m="${i}"><div>${esc(fill(m.tn))}</div>${arDiv(m)}
        <div class="fr" ${S.opts.fr ? '' : 'hidden'}>${esc(fill(m.fr))}</div>${sayBtn(V(m))}${m.correction ? `<div class="corr"><b>Correction :</b> ${esc(m.correction)}</div>` : ''}</div></div>`).join('')
    + (st.busy ? `<div class="say">${avatar(k, 36)}<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>` : '');
  const cb = $('#cb'); if (!cb) return;
  cb.innerHTML = html;
  cb.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const f = b.querySelector('.fr'); if (f) f.hidden = false; });
  cb.scrollTop = cb.scrollHeight;
  const last = st.msgs[st.msgs.length - 1];
  const sg = $('#sg');
  sg.innerHTML = last && last.sugg && last.sugg.tn ? `<div class="sugg"><button class="use" id="su"><small>Tu pourrais répondre :</small><b>${esc(last.sugg.tn)}</b> · ${esc(last.sugg.fr || '')}</button></div>` : '';
  const su = $('#su'); if (su) su.onclick = () => { $('#ti').value = last.sugg.tn; $('#ti').focus(); };
  $('#mc').classList.toggle('live', st.listening);
}

async function hear(run){
  const st = chatState;
  if (!(Native.Speech || SR)) { setStatus('Micro indisponible ici : écris ta réponse.'); return; }
  st.listening = true; drawChat(); setStatus('Je t’écoute…');
  let heard = [];
  try { heard = await listen({ lang: st.lang, popup: !st.hands }); }
  catch(e){ setStatus(e.message === 'refus' ? 'Micro refusé : autorise-le dans les réglages Android.' : 'Je n’ai pas compris.'); }
  if (run !== chatRun) return;
  st.listening = false; drawChat();
  if (heard.length) return turn(heard[0], run);
  if (st.hands) { st.hands = false; $('#hf').classList.remove('on'); setStatus('Pause : touche le micro ou réactive « mains libres ».'); }
  else setStatus('Je n’ai rien entendu. Réessaie.');
}

async function turn(text, run){
  const st = chatState;
  if (chatLeft() <= 0) { st.msgs.push({ role: 'ai', err: MN() + ' est fatiguée pour aujourd’hui (limite gratuite atteinte). Reviens demain, ou révise ton carnet !' }); drawChat(); return; }
  st.msgs.push({ role: 'me', text }); st.busy = true; drawChat(); setStatus('');
  S.chat.count++; save();
  let r;
  try { r = await gemini(st.key, st.msgs); }
  catch(e){ r = { err: e.message === 'quota' ? 'Trop de monde parle à la famille en ce moment (limite gratuite). Réessaie dans une minute.' : e.message === 'reseau' ? 'Pas de connexion internet : la discussion a besoin du réseau.' : /^cle/.test(e.message) ? 'Google refuse la clé de l’appli (code ' + e.message.slice(3) + '). Préviens celui qui a installé l’appli.' : 'Petit souci (' + e.message + '), répète ta phrase.' }; }
  if (run !== chatRun) return;
  st.busy = false;
  if (r.err) { st.msgs.push({ role: 'ai', err: r.err }); drawChat(); return; }
  st.msgs.push({ role: 'ai', tn: r.tn, ar: r.ar, fr: r.fr, correction: r.correction || '', sugg: { tn: r.suggestion_tn, fr: r.suggestion_fr } });
  drawChat();
  await speak(V(r));
  if (run === chatRun && st.hands) hear(run);
}

async function gemini(key, msgs){
  const p = CHAT.personas[key];
  const sys = fill(CHAT.rules + '\n\nTON PERSONNAGE : ' + p.prompt);
  const contents = [{ role: 'user', parts: [{ text: '(L’élève ouvre l’appli et arrive dans la conversation.)' }] }]
    .concat(msgs.filter(m => !m.err).slice(-16).map(m => m.role === 'me'
      ? { role: 'user', parts: [{ text: m.text }] }
      : { role: 'model', parts: [{ text: JSON.stringify({ tn: m.tn, ar: m.ar, fr: m.fr }) }] }));
  const body = JSON.stringify({
    systemInstruction: { parts: [{ text: sys }] }, contents,
    generationConfig: { temperature: 0.9, maxOutputTokens: 2048, responseMimeType: 'application/json',
      responseSchema: { type: 'OBJECT', properties: { tn: { type: 'STRING' }, ar: { type: 'STRING' }, fr: { type: 'STRING' }, correction: { type: 'STRING' }, suggestion_tn: { type: 'STRING' }, suggestion_fr: { type: 'STRING' } },
        required: ['tn', 'ar', 'fr', 'correction', 'suggestion_tn', 'suggestion_fr'] } }
  });
  let last = 'autre';
  for (const model of CHAT.models) {
    let res;
    try { res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(GEMINI_KEY)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body }); }
    catch(e){ throw new Error('reseau'); }
    if (!res.ok) { last = res.status === 429 ? 'quota' : [400, 401, 403].includes(res.status) ? 'cle' + res.status : 'autre' + res.status; continue; }
    const j = await res.json();
    const parts = (((j.candidates || [])[0] || {}).content || {}).parts || [];
    const txt = parts.filter(x => !x.thought).map(x => x.text || '').join('').replace(/^```(json)?|```$/g, '').trim();
    try { const o = JSON.parse(txt); if (o.tn) { if (!o.ar) o.ar = o.tn; return o; } } catch(e){}
    last = 'autre';
  }
  throw new Error(last);
}

// ---------- Démarrage ----------
if ('speechSynthesis' in window) speechSynthesis.getVoices();
restore().then(() => {
  usePack(); home();
  loadVoices().then(() => { if (screen === 'home') home(); });
  if (S.notif.on) scheduleNotif();
});
if (Native.App) Native.App.addListener('pause', save);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });
</script>
